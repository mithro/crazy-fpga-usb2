# NeTV2 JTAG interface config for Raspberry Pi OS "trixie" (Debian 13)
#
# One interface file for Pi 3B+ / Pi 4 / Pi 5 using OpenOCD 0.12's
# `linuxgpiod` (libgpiod / character-device) driver. This REPLACES the 2019
# `bcm2835gpio` configs (alphamax-rpi.cfg, alphamax-rpi-4.cfg): on the Pi 5 the
# 40-pin header is driven by the RP1 chip over PCIe, so the old memory-mapped
# bcm2835gpio driver cannot work at all, and OpenOCD 0.12 replaced the
# `bcm2835gpio_jtag_nums` style with `adapter gpio <sig> -chip <n> <line>`.
#
# NeTV2 JTAG header -> RPi 40-pin GPIO (identical wiring on Pi 3/4/5):
#   TCK  = GPIO 4  (physical pin 7)   output
#   TMS  = GPIO 17 (physical pin 11)  output
#   TDI  = GPIO 27 (physical pin 13)  output
#   TDO  = GPIO 22 (physical pin 15)  input
#   SRST = GPIO 24 (physical pin 18)  output
#   GND  = physical pin 20
#
# The GPIO *line numbers* above are BCM numbers and are the same on every model;
# only the gpiochip that carries the 40-pin header changes between models, which
# is what the auto-detection below resolves.
#
# Usage (this file also sources the Xilinx Series-7 PLD/TAP definition, see the
# end of the file, so no second -f is needed):
#   sudo openocd -f netv2-jtag-gpiod.cfg -c "init; scan_chain; pld load 0 top.bit; exit"
#
# reset_config: srst is wired (GPIO 24) and harmless to declare here; the Pi 3
# bcm2835 config uses "reset_config none" because that OpenOCD 0.10 build
# misbehaved with srst on the NeTV2. Neither flow asserts a reset for a load.

adapter driver linuxgpiod

proc read_file { name } {
    if {[catch {open $name r} fd]} { return "" }
    set result [read $fd]
    close $fd
    return $result
}

# Find the /dev/gpiochip index that carries the 40-pin header.
#
# Pi 5: the header hangs off the RP1 chip; its device-tree gpio alias content
#       contains "/rp1/" (same rule as OpenOCD's stock raspberrypi5-gpiod.cfg).
# Pi 3/4: no RP1; the header is the SoC controller gpio@7e200000
#       (pinctrl-bcm2835 / pinctrl-bcm2711). Its alias content contains
#       "7e200000".
# The alias filename is gpio<N>; N is the /dev/gpiochip index libgpiod wants.
proc find_gpio_chip {} {
    # explicit override wins (e.g. NETV2_JTAG_GPIOCHIP=0 for an odd install)
    if {[info exists ::env(NETV2_JTAG_GPIOCHIP)]} {
        return $::env(NETV2_JTAG_GPIOCHIP)
    }
    set aliases [lsort [glob -nocomplain -directory "/proc/device-tree/aliases" "gpio\[0-9\]"]]
    # Prefer RP1 (Pi 5).
    foreach f $aliases {
        if {[string match "*/rp1/*" [read_file $f]]} { return [string index $f end] }
    }
    # Fall back to the BCM SoC 40-pin controller (Pi 3/4).
    foreach f $aliases {
        if {[string match "*7e200000*" [read_file $f]]} { return [string index $f end] }
    }
    # Last resort: gpiochip0 (documented Pi 3/4 default) with a loud warning.
    echo "WARN: could not auto-detect the 40-pin gpiochip; defaulting to chip 0."
    echo "WARN: set NETV2_JTAG_GPIOCHIP if IDCODE reads 0x00000000/0xffffffff."
    return 0
}

# RP1 reaches the Pi 5 over PCIe; if ASPM power-saving is on the first pulses
# can be clocked far too fast. Warn (do not fail) so Pi 3/4 stay unaffected.
set pcie_aspm [read_file /sys/module/pcie_aspm/parameters/policy]
if {[string length $pcie_aspm] && ![string match {*\[performance\]*} $pcie_aspm]} {
    echo "WARN: PCIe ASPM not set to performance; JTAG timing may be unreliable on Pi 5."
    echo "WARN: run: echo performance | sudo tee /sys/module/pcie_aspm/parameters/policy"
}

set GPIO_CHIP [find_gpio_chip]

# NeTV2 JTAG pin mapping (BCM line numbers, resolved gpiochip)
adapter gpio tck  -chip $GPIO_CHIP 4
adapter gpio tms  -chip $GPIO_CHIP 17
adapter gpio tdi  -chip $GPIO_CHIP 27
adapter gpio tdo  -chip $GPIO_CHIP 22
adapter gpio srst -chip $GPIO_CHIP 24
reset_config srst_only srst_push_pull

transport select jtag

# libgpiod bit-banging tops out well below the old bcm2835gpio fork; 1 MHz is a
# safe, reliable default across Pi 3/4/5. Override at the CLI with `adapter
# speed` after sourcing if you want to experiment.
adapter speed 1000

# The Series-7 TAP/PLD definition moved between OpenOCD releases; try both locations.
if {[catch {source [find cpld/xilinx-xc7.cfg]}]} { source [find fpga/xlnx/xc7.cfg] }
