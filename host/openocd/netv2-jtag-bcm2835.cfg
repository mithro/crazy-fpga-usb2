# NeTV2 JTAG over Raspberry Pi 3 GPIO for OpenOCD 0.10 (Raspbian stretch, bcm2835gpio driver).
# Derived from alphamax-rpi.cfg in AlphamaxMedia/netv2mvp-scripts.
#
#   TCK = GPIO 4, TMS = GPIO 17, TDI = GPIO 27, TDO = GPIO 22, SRST = GPIO 24
#
# Usage: sudo openocd -f netv2-jtag-bcm2835.cfg -c "init; scan_chain; pld load 0 top.bit; exit"
interface bcm2835gpio
bcm2835gpio_peripheral_base 0x3F000000
bcm2835gpio_speed_coeffs 100000 5
# tck tms tdi tdo
bcm2835gpio_jtag_nums 4 17 27 22
bcm2835gpio_srst_num 24
transport select jtag
reset_config none
# The Series-7 TAP/PLD definition moved between OpenOCD releases; try both locations.
if {[catch {source [find cpld/xilinx-xc7.cfg]}]} { source [find fpga/xlnx/xc7.cfg] }
